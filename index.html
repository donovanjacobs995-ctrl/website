<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="datetime-container"></div>
    <div class="container">
        <header>
            <img src="https://res.cloudinary.com/dguzb0u6h/image/upload/v1761720017/cld-sample-5.jpg" alt="Futuristic cityscape" class="header-image">
            <h1><span id="typewriter"></span></h1>
            <p>Your Gateway to the Decentralized World</p>
        </header>
        <main>
            <a href="#" id="explore-future-btn" class="cta-button">Explore the Future</a>
        </main>
    </div>

    <div id="chatbot-container">
        <div id="chatbot-header">
            <span>Chat with us!</span>
            <button id="close-chatbot">-</button>
        </div>
        <div id="chatbot-messages">
            <div class="chatbot-message bot">Welcome! How can I help you with your shoe comfort or foot care questions?</div>
        </div>
        <div id="chatbot-input-container">
            <input type="text" id="chatbot-input" placeholder="Ask a question...">
            <button id="chatbot-submit">Send</button>
        </div>
    </div>
    <button id="open-chatbot">Chat</button>

    <script src="script.js"></script>
</body>
</html>
